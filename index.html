<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecallForge — Production Study System</title><style>
:root{--bg:#081018;--panel:#0d1724;--panel2:#111f31;--line:#23364f;--text:#edf5ff;--muted:#91a4bd;--a:#5be7ce;--a2:#75a7ff;--ok:#66e3a3;--bad:#ff7183}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101b,#0a1420 40%,#07101a);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1400px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:20px}.brand{font-weight:900;font-size:22px}.brand span{color:var(--a)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--a2),var(--a));color:#041016;border:0;font-weight:800}.btn.danger{color:#ffc0c7}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--line);background:rgba(13,23,36,.94);border-radius:18px;padding:18px}.hero{padding:55px 0}.hero h1{font-size:clamp(38px,6vw,74px);line-height:.95;letter-spacing:-3px;max-width:950px;margin:12px 0}.hero p{color:var(--muted);font-size:18px;line-height:1.55;max-width:900px}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px}.muted{color:var(--muted)}.hidden{display:none}.section{margin-top:20px}.exam{cursor:pointer;min-height:140px}.exam.selected{border-color:var(--a);box-shadow:0 0 0 1px #5be7ce33 inset}.exam h3{margin:0 0 6px}.exam small{color:var(--a)}label{display:grid;gap:7px;color:#c8d6e7;font-size:13px}input,textarea,select{background:#09131f;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}textarea{min-height:130px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.drop{padding:25px;border:1.5px dashed #3a5878;border-radius:16px;text-align:center;color:var(--muted)}.bar{height:10px;border-radius:999px;background:#132338;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a));width:0}.plan{display:grid;gap:8px}.day{border:1px solid var(--line);border-radius:13px;padding:12px}.day b{display:block}.task{padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:7px;background:#0a1420}.q{font-size:21px;font-weight:750;line-height:1.45;margin:16px 0}.answers{display:grid;gap:9px}.answer{text-align:left}.feedback{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0a1420;line-height:1.5}.chat{height:430px;overflow:auto;display:grid;gap:10px}.msg{max-width:84%;padding:10px 12px;border-radius:13px;line-height:1.5}.user{justify-self:end;background:#173152}.ai{background:#0b1421;border:1px solid var(--line)}.timer{font-size:66px;font-weight:900;text-align:center;letter-spacing:-3px}.flash{min-height:250px;display:grid;place-items:center;text-align:center;padding:25px}.metric{font-size:32px;font-weight:900}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="nav"><div class="brand">Recall<span>Forge</span></div><div id="navActions"></div></div><div id="app"></div></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let me=null, exams=[], profile=null, dashboard=null, currentQ=null, timer=null, timerSec=1500, mockTimerHandle=null;
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function nav(){ $('#navActions').innerHTML=me?`<div class="row"><span class="pill">${esc(me.email)}</span><button class="btn" onclick="logout()">Sign out</button></div>`:'' }
async function logout(){await api('/auth/logout',{method:'POST'});location.reload()}
function landing(){nav();$('#app').innerHTML=`<section class="hero"><span class="pill">Production architecture · server-side AI · durable memory</span><h1>A study system built to train for the exam—not just make pretty questions.</h1><p>RecallForge turns your actual syllabus and materials into a dated study system, then repeatedly retrieves, mixes, marks, and reschedules what you know and what you forget.</p><div class="row section"><a class="btn primary" href="/auth/google">Sign in with Google</a><span class="muted">Your Google identity is verified on the server.</span></div></section><div class="grid g3"><div class="card"><h3>Strict assessment</h3><p class="muted">Generated items are adversarially checked before delivery, and constructed responses are scored against explicit criteria.</p></div><div class="card"><h3>Durable memory</h3><p class="muted">The scheduler prioritizes retrieval, distributed reviews, interleaving, and re-testing after failure.</p></div><div class="card"><h3>Your sources first</h3><p class="muted">Questions are grounded in the materials you supply instead of inventing a textbook you never studied.</p></div></div>`}
async function boot(){const d=await api('/api/me');me=d.user; if(!me)return landing();nav();const e=await api('/api/exams');exams=e.exams;dashboard=(await api('/api/dashboard'));profile=dashboard.profile;if(!profile)return setup();home()}
function setup(){nav();$('#app').innerHTML=`<div class="card"><div class="row between"><div><h2>Build your exam profile</h2><div class="muted">Choose the assessment system first. The plan is created only after your date, target and materials are known.</div></div><span class="pill">Step 1 of 4</span></div><div class="grid g3 section" id="exams">${exams.map(e=>`<div class="card exam" data-id="${e.id}" onclick="pickExam('${e.id}')"><h3>${esc(e.name)}</h3><small>${esc(e.versionRule)}</small><p class="muted">${esc(e.difficultyModel)}</p></div>`).join('')}</div><div class="grid g4 section"><label>Subject<select id="subject"><option value="">Choose after selecting an exam</option></select></label><label>Exam year<select id="examYear"><option value="">Auto / current profile</option></select></label><label>Test date<input id="date" type="date"></label><label>Daily study minutes<input id="mins" type="number" min="15" max="600" step="15" value="90"></label></div><div class="card section"><div class="row between"><b>Target grade / intensity</b><span id="targetVal">A-</span></div><input id="target" type="range" min="0" max="12" value="10" oninput="targetVal.textContent=gradeName(+this.value)"><div class="row between muted"><span>F- / survival</span><span>A+ / maximum intensity</span></div></div><button class="btn primary section" onclick="createProfile()">Continue to materials</button></div>`}
let selectedExam=null;function pickExam(id){selectedExam=id;document.querySelectorAll('.exam').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));const e=exams.find(x=>x.id===id);if(e){$('#subject').innerHTML='<option value="">Select subject</option>'+e.subjects.map(s=>`<option>${esc(s)}</option>`).join('');$('#examYear').innerHTML='<option value="">Select year</option>'+e.years.map(y=>`<option value="${y}">${y}</option>`).join('')}}const gradeName=n=>['F-','F','F+','D-','D','D+','C-','C','C+','B','A-','A','A+'][n]||'A-';
async function createProfile(){if(!selectedExam)return alert('Select an exam');const date=$('#date').value;if(!date)return alert('Select a test date');const d=await api('/api/profile',{method:'POST',body:JSON.stringify({examId:selectedExam,examYear:$('#examYear').value||null,subject:$('#subject').value.trim(),testDate:date,targetGrade:$('#target').value,dailyMinutes:$('#mins').value})});location.href='/?profile='+d.id}
function materials(){ }
async function ensureProfile(){const d=await api('/api/dashboard');dashboard=d;profile=d.profile}
function dashboardHome(){const done=dashboard.tasks.filter(t=>t.completed_at).length,total=dashboard.tasks.length;const acc=Number(dashboard.stats?.accuracy||0);return `<div class="grid g3"><div class="card"><div class="muted">Target</div><div class="metric">${esc(gradeName(Number(profile.target_grade)))}</div><div class="muted">${esc(profile.exam_id.toUpperCase())} · Year ${esc(profile.exam_year||'auto')} · ${esc(profile.subject||'Custom subject')}</div></div><div class="card"><div class="muted">Due recall</div><div class="metric">${dashboard.cards.length}</div><div class="muted">Use retrieval before revealing</div></div><div class="card"><div class="muted">Plan completion</div><div class="metric">${total?Math.round(done/total*100):0}%</div><div class="muted">${done}/${total} tasks</div></div><div class="card"><div class="muted">Practice accuracy</div><div class="metric">${Math.round(acc*100)}%</div><div class="muted">Last measured attempts</div></div><div class="card"><div class="muted">Weak skills</div><div class="metric">${dashboard.mastery.filter(x=>Number(x.mastery)<.55).length}</div><div class="muted">Auto-prioritized for retesting</div></div></div>`}
function home(){nav();$('#app').innerHTML=`<div class="row between"><div><span class="pill">${esc(profile.exam_id.toUpperCase())}</span><h2>Study cockpit</h2><div class="muted">${esc(profile.subject||'Subject not specified')} · Test ${esc(String(profile.test_date).slice(0,10))}</div></div><div class="row"><button class="btn" onclick="showSetupMaterials()">Materials</button><button class="btn" onclick="showPlan()">Plan</button><button class="btn" onclick="showPractice()">Practice</button><button class="btn" onclick="showCards()">Flashcards</button><button class="btn" onclick="showMocks()">Mock Exams</button><button class="btn" onclick="showDiagnostic()">Diagnostic</button><button class="btn" onclick="showGames()">Games</button><button class="btn" onclick="showTutor()">Tutor</button><button class="btn" onclick="showAnalytics()">Analytics</button><button class="btn" onclick="showTasks()">Today</button><button class="btn" onclick="showFocus()">Focus</button></div></div><div class="section">${dashboardHome()}</div><div id="panel" class="section"></div>`;showSetupMaterials()}
function showSetupMaterials(){panel.innerHTML=`<div class="card"><h2>Material vault</h2><p class="muted">Upload PDFs/DOCX/text/images, paste notes, or import a web / Google Docs / Sheets URL. Every item is tied to this study profile and chunked server-side.</p><div class="drop" id="drop"><input id="files" type="file" multiple><p>Or drag files here.</p><button class="btn primary" onclick="uploadFiles()">Upload files</button></div><div class="grid g2 section"><div><label>Plain text / notes<textarea id="notes" placeholder="Paste lecture notes, teacher comments, formula sheets, etc."></textarea></label><button class="btn section" onclick="saveNotes()">Save notes</button></div><div><label>Link / YouTube / Google Docs / Sheets<input id="url" placeholder="https://..."></label><button class="btn section" onclick="addLink()">Import link</button><p class="muted small">Private Google Docs/Sheets use the Google Drive read permission granted during sign-in.</p></div></div><div id="materialList" class="section"></div></div>`}
async function loadMaterials(){const d=await api('/api/materials?profileId='+encodeURIComponent(profile.id));materialList.innerHTML=d.materials.map(m=>`<div class="task"><b>${esc(m.original_name||m.source_url||m.kind)}</b> · ${esc(m.status)} <span class="muted">${esc(m.mime_type||'')}</span>${m.error?`<div class="bad">${esc(m.error)}</div>`:''}</div>`).join('')||'<p class="muted">No materials yet.</p>';}async function uploadFiles(){const files=$('#files').files;if(!files.length)return alert('Choose files first');const fd=new FormData();fd.append('profileId',profile.id);for(const f of files)fd.append('files',f);const r=await fetch('/api/materials/upload',{method:'POST',body:fd,credentials:'include'});const d=await r.json();if(!r.ok)throw alert(d.error);alert(`${d.ids.length} material(s) imported`)}
async function addLink(){const u=$('#url').value.trim();if(!u)return;await api('/api/materials/link',{method:'POST',body:JSON.stringify({profileId:profile.id,url:u})});$('#url').value='';alert('Imported');await loadMaterials()}async function saveNotes(){const t=$('#notes').value.trim();if(!t)return;await api('/api/materials/text',{method:'POST',body:JSON.stringify({profileId:profile.id,text:t,name:'Pasted notes'})});$('#notes').value='';alert('Saved');await loadMaterials()} 
async function showPlan(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Plan generator</h2><p class="muted">The AI will create a day-by-day schedule from today through the test date.</p></div><button class="btn primary" onclick="genPlan()">Generate plan</button></div><div id="planOut" class="section"></div></div>`}
async function genPlan(){planOut.innerHTML='<p class="muted">Generating and validating plan…</p>';const p=await api('/api/plan/generate',{method:'POST',body:JSON.stringify({profileId:profile.id})});planOut.innerHTML=`<div class="feedback"><b>QA validated plan</b><p class="muted">The planner ran a second-pass schedule audit for date continuity, time budget, coverage, retrieval, spacing, interleaving and exam taper.</p></div><div class="plan">${p.days.map(d=>`<div class="day"><b>${esc(d.date)} · ${d.minutes} min</b><div class="muted">${esc(d.focus)}</div>${d.tasks.map(t=>`<div class="task">${esc(t.type)} · ${esc(t.title)} · ${t.minutes} min · ${esc(t.skill)}</div>`).join('')}</div>`).join('')}</div><button class="btn primary section" onclick="confirmPlan()">Confirm this plan</button>`}
async function confirmPlan(){await api('/api/plan/confirm',{method:'POST',body:JSON.stringify({profileId:profile.id})});alert('Plan confirmed. Adaptive practice is now active.');await ensureProfile();}
async function showPractice(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Strict practice</h2><div class="muted">Original exam-style questions are adversarially verified before delivery. Practice can target Easy → Medium → Hard or adapt to weak skills.</div></div><div class="row"><button class="btn" onclick="genQuestions('easy')">Easy</button><button class="btn" onclick="genQuestions('medium')">Medium</button><button class="btn" onclick="genQuestions('hard')">Hard</button><button class="btn primary" onclick="genQuestions('adaptive')">Adaptive 10</button></div></div><div id="practice" class="section"><button class="btn" onclick="nextQuestion('adaptive')">Open a question</button></div></div>`}
async function genQuestions(mode='adaptive'){const map={easy:'easy',medium:'medium',hard:'hard',adaptive:'mixed'};await api('/api/questions/generate',{method:'POST',body:JSON.stringify({profileId:profile.id,count:10,mode:map[mode]})});await nextQuestion(mode)}
async function nextQuestion(mode='adaptive'){const d=await api('/api/questions/next?profileId='+encodeURIComponent(profile.id)+'&mode='+encodeURIComponent(mode));currentQ=d.question;if(!currentQ){practice.innerHTML='<p class="muted">No questions yet. Generate some first.</p>';return}const choices=currentQ.choices?(Array.isArray(currentQ.choices)?currentQ.choices:JSON.parse(currentQ.choices)):null;practice.innerHTML=`<div class="pill">${esc(currentQ.skill)} · difficulty ${Number(currentQ.difficulty).toFixed(1)}/10 · ${esc(currentQ.type)}</div><div class="q">${esc(currentQ.prompt)}</div>${choices?`<div class="answers">${choices.map((c,i)=>`<button class="btn answer" onclick="answerMCQ(${i})">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>`:`<textarea id="response" placeholder="Write your full answer. The marker will be strict."></textarea><button class="btn primary section" onclick="gradeOpen()">Submit for marking</button>`}<div id="feedback" class="section"></div>`}
async function answerMCQ(i){await gradeResponse(String(i))}async function gradeOpen(){await gradeResponse($('#response').value)}async function gradeResponse(resp){const d=await api('/api/questions/'+currentQ.id+'/grade',{method:'POST',body:JSON.stringify({response:resp})});feedback.innerHTML=`<div class="feedback"><b>${d.score}/${d.maxScore}</b><p>${esc(d.feedback)}</p><b>Corrections</b><ul>${d.corrections.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Strict errors:</b> ${d.strictErrors.length?d.strictErrors.map(esc).join(' · '):'None'}</p><p><b>Model answer:</b> ${esc(d.modelAnswer)}</p></div><button class="btn section" onclick="nextQuestion()">Next question</button>`}
function showCards(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Flashcards</h2><p class="muted">Generated for active recall and scheduled with a stateful memory model.</p></div><button class="btn primary" onclick="genCards()">Generate cards</button></div><div id="flash" class="section"></div></div>`;loadDueCard()}
let card=null,cardBack=false;async function loadDueCard(){await ensureProfile();card=dashboard.cards[0];cardBack=false;if(!card){flash.innerHTML='<p class="muted">No cards are due right now. Generate cards or come back when the scheduler says they are due.</p>';return}flash.innerHTML=`<div class="card flash" onclick="cardBack=!cardBack;loadCardView()"><div><div class="pill">${cardBack?'Answer':'Recall prompt'}</div><h2>${esc(cardBack?card.back:card.front)}</h2><p class="muted">Click to flip. Rate only how difficult retrieval actually felt. Target retention is 90% by default.</p></div></div>`}function loadCardView(){flash.innerHTML=`<div class="card flash" onclick="cardBack=!cardBack;loadCardView()"><div><div class="pill">${cardBack?'Answer':'Recall prompt'}</div><h2>${esc(cardBack?card.back:card.front)}</h2></div></div>${cardBack?`<div class="row section"><button class="btn danger" onclick="review(1)">Again</button><button class="btn" onclick="review(2)">Hard</button><button class="btn" onclick="review(3)">Good</button><button class="btn primary" onclick="review(4)">Easy</button></div>`:''}`}async function review(r){await api('/api/cards/'+card.id+'/review',{method:'POST',body:JSON.stringify({rating:r})});await loadDueCard()}async function genCards(){await api('/api/cards/generate',{method:'POST',body:JSON.stringify({profileId:profile.id,count:25})});await ensureProfile();loadDueCard()}
function showTutor(){panel.innerHTML=`<div class="grid g2"><div class="card"><h2>Strict tutor</h2><div id="chat" class="chat"></div><div class="row section"><input id="chatIn" placeholder="What don't you understand?"><button class="btn primary" onclick="sendTutor()">Ask</button></div></div><div class="card"><h2>Micro-lesson video</h2><label>Topic<input id="videoTopic" placeholder="e.g. electrophilic addition"></label><button class="btn primary section" onclick="makeVideoScript()">Generate teaching video script</button><div id="videoOut" class="section"></div></div></div>`}
async function sendTutor(){const x=$('#chatIn').value.trim();if(!x)return;chat.innerHTML+=`<div class="msg user">${esc(x)}</div>`;const a=await api('/api/tutor',{method:'POST',body:JSON.stringify({profileId:profile.id,question:x})});chat.innerHTML+=`<div class="msg ai"><b>Explanation</b><p>${esc(a.explanation)}</p><b>Misconception</b><p>${esc(a.misconception)}</p><b>Retrieve:</b> ${esc(a.retrievalQuestion)}<br><b>Transfer:</b> ${esc(a.transferQuestion)}</div>`;$('#chatIn').value='';chat.scrollTop=chat.scrollHeight}
async function makeVideoScript(){const a=await api('/api/video-script',{method:'POST',body:JSON.stringify({profileId:profile.id,topic:$('#videoTopic').value})});videoOut.innerHTML=`<h3>${esc(a.title)}</h3>${a.scenes.map(s=>`<div class="feedback"><b>${s.seconds}s</b> · ${esc(s.visual)}<br>${esc(s.narration)}</div>`).join('')}<p class="muted">Retrieval prompts: ${a.retrievalPrompts.map(esc).join(' · ')}</p>`}
function showTasks(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Today / plan tasks</h2><p class="muted">Complete the scheduled work; missed work is not silently counted as mastery.</p></div><button class="btn" onclick="ensureProfile().then(showTasks)">Refresh</button></div><div class="plan section">${dashboard.tasks.filter(t=>t.study_date<=profile.test_date).map(t=>`<div class="task"><div class="row between"><div><b>${esc(t.title)}</b><div class="muted">${esc(String(t.study_date).slice(0,10))} · ${t.minutes} min · ${esc(t.topic||'')}</div></div><button class="btn ${t.completed_at?'primary':''}" onclick="completeTask('${t.id}')">${t.completed_at?'Completed':'Complete'}</button></div></div>`).join('')}</div></div>`}async function completeTask(id){await api('/api/tasks/'+id+'/complete',{method:'POST',body:JSON.stringify({profileId:profile.id})});await ensureProfile();showTasks()}
function showDiagnostic(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Diagnostic quiz</h2><p class="muted">This deliberately samples the syllabus broadly, then routes weak skills into focused practice.</p></div><button class="btn primary" onclick="startDiagnostic()">Start diagnostic</button></div><div id="diag" class="section"></div></div>`}let diagnosticId=null;async function startDiagnostic(){const d=await api('/api/diagnostic/generate',{method:'POST',body:JSON.stringify({profileId:profile.id})});diagnosticId=d.id;await nextDiagnostic()}async function nextDiagnostic(){const d=await api('/api/diagnostic/next?id='+encodeURIComponent(diagnosticId));if(!d.question){diag.innerHTML='<div class="feedback"><b>Diagnostic complete.</b><p>Use Analytics to see weak areas; the system will prioritize them.</p></div>';return}const q=d.question;const choices=q.choices?(Array.isArray(q.choices)?q.choices:JSON.parse(q.choices)):null;diag.innerHTML=`<div class="pill">${esc(q.skill)} · ${esc(q.type)}</div><div class="q">${esc(q.prompt)}</div>${choices?`<div class="answers">${choices.map((c,i)=>`<button class="btn answer" onclick="gradeDiagnostic('${String(i)}')">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>`:`<textarea id="diagResp"></textarea><button class="btn primary section" onclick="gradeDiagnostic($('#diagResp').value)">Submit</button>`}<div id="diagFeedback" class="section"></div>`;window.currentDiagQ=q}async function gradeDiagnostic(resp){const d=await api('/api/questions/'+currentDiagQ.id+'/grade',{method:'POST',body:JSON.stringify({response:resp,taskType:'diagnostic'})});diagFeedback.innerHTML=`<div class="feedback"><b>${d.score}/${d.maxScore}</b><p>${esc(d.feedback)}</p><p><b>Errors:</b> ${d.strictErrors.map(esc).join(' · ')||'None'}</p></div><button class="btn section" onclick="nextDiagnostic()">Next</button>`}
function showMocks(){panel.innerHTML=`<div class="card"><h2>Mock exams</h2><p class="muted">Full-length or custom-length timed papers built from verified generated items and your current material.</p><div class="grid g3 section"><label>Title<input id="mockTitle" value="RecallForge Mock Exam"></label><label>Questions<input id="mockCount" type="number" min="5" max="50" value="25"></label><label>Minutes<input id="mockMin" type="number" min="10" max="300" value="120"></label></div><button class="btn primary section" onclick="createMock()">Generate mock</button><div id="mockOut" class="section"></div></div>`}async function createMock(){mockOut.innerHTML='<p class="muted">Building and adversarially checking the paper…</p>';const d=await api('/api/mock/generate',{method:'POST',body:JSON.stringify({profileId:profile.id,title:$('#mockTitle').value,count:Number($('#mockCount').value),duration:Number($('#mockMin').value)})});mockOut.innerHTML=`<button class="btn primary" onclick="openMock('${d.id}')">Start ${d.duration}-minute mock</button>`}let activeMock=null;async function openMock(id){const d=await api('/api/mock/'+id);activeMock=d.mock;const st=await api('/api/mock/'+id+'/start',{method:'POST'});activeMock.ends_at=st.endsAt;renderMock(d);startMockClock(st.endsAt)}function startMockClock(endsAt){if(mockTimerHandle)clearInterval(mockTimerHandle);const tick=()=>{const el=document.querySelector('#mockClock');if(!el)return;const ms=new Date(endsAt).getTime()-Date.now();if(ms<=0){el.textContent='TIME EXPIRED — submit now';el.classList.add('bad');clearInterval(mockTimerHandle);mockTimerHandle=null;return}const sec=Math.floor(ms/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`};tick();mockTimerHandle=setInterval(tick,1000)}
function renderMock(d){const answers=Object.fromEntries(d.answers.map(a=>[a.question_id,a]));mockOut.innerHTML=`<div class="row between"><div class="pill">${esc(activeMock.title)} · ${activeMock.duration_minutes} min · strict marking</div><div class="pill"><b id="mockClock">--:--</b></div></div><div class="plan section">${d.questions.map((q,i)=>{const a=answers[q.id];const ch=q.choices?(Array.isArray(q.choices)?q.choices:JSON.parse(q.choices)):null;return `<div class="card"><b>Q${i+1}</b> · ${esc(q.skill)}<div class="q">${esc(q.prompt)}</div>${a?`<div class="feedback"><b>Submitted:</b> ${esc(a.response)}</div>`:(ch?`<div class="answers">${ch.map((c,j)=>`<button class="btn answer" onclick="mockAnswer('${q.id}','${String(j)}')">${String.fromCharCode(65+j)}. ${esc(c)}</button>`).join('')}</div>`:`<textarea id="m${q.id}"></textarea><button class="btn section" onclick="mockAnswer('${q.id}',$('#m${q.id}').value)">Submit answer</button>`)}<div id="mf${q.id}" class="section"></div></div>`}).join('')}</div><button class="btn primary section" onclick="submitMock('${activeMock.id}')">Finish mock</button>`}async function mockAnswer(qid,response){await api('/api/mock/'+activeMock.id+'/answer',{method:'POST',body:JSON.stringify({questionId:qid,response})});document.querySelector('#mf'+qid).innerHTML='<div class="muted">Answer saved. Marking is hidden until you submit the mock.</div>'}async function submitMock(id){if(mockTimerHandle){clearInterval(mockTimerHandle);mockTimerHandle=null}const d=await api('/api/mock/'+id+'/submit',{method:'POST'});mockOut.innerHTML=`<div class="card"><h3>Mock result</h3><div class="metric">${Math.round(d.percentage*100)}%</div><p class="muted">Marks were hidden during the test and released only after submission.</p><div class="plan section">${(d.details||[]).map(x=>`<div class="feedback"><b>${x.score}/${x.max_score}</b><p>${esc(x.grading?.feedback||'')}</p><p><b>Strict errors:</b> ${(x.grading?.strictErrors||[]).map(esc).join(' · ')||'None'}</p></div>`).join('')}</div></div>`}
function showGames(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Learning games</h2><p class="muted">Games are short retrieval tasks, not entertainment-only drills.</p></div><select id="gameMode"><option>classification</option><option>error-hunt</option><option>sequence</option><option>two-truths-one-false</option><option>rapid-choice</option></select><button class="btn primary" onclick="newGame()">Generate game</button></div><div id="gameOut" class="section"></div></div>`}let activeGame=null;async function newGame(){const d=await api('/api/game/generate',{method:'POST',body:JSON.stringify({profileId:profile.id,mode:$('#gameMode').value})});activeGame=d.game;renderGame()}function renderGame(){gameOut.innerHTML=`<div class="pill">${esc(activeGame.skill)} · ${esc(activeGame.type)}</div><h2>${esc(activeGame.title)}</h2><p class="muted">${esc(activeGame.rules)}</p><div class="q">${esc(activeGame.prompt)}</div><div class="answers">${activeGame.choices.map((c,i)=>`<button class="btn answer" onclick="answerGame(${i})">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>`}async function answerGame(i){const correct=String(i)===String(activeGame.answer)||activeGame.choices[i]===activeGame.answer;gameOut.innerHTML+=`<div class="feedback section"><b>${correct?'Correct':'Not quite'}</b><p>${esc(activeGame.explanation)}</p></div>`}
function showAnalytics(){panel.innerHTML=`<div class="card"><div class="row between"><div><h2>Mastery & retention</h2><p class="muted">The system prioritizes weak, uncertain, high-value skills and keeps previously learned material in rotation.</p></div><button class="btn" onclick="loadAnalytics()">Refresh</button></div><div id="analyticsOut" class="section"></div></div>`;loadAnalytics()}async function loadAnalytics(){const d=await api('/api/analytics?profileId='+encodeURIComponent(profile.id));analyticsOut.innerHTML=`<div class="grid g3">${d.skills.map(s=>`<div class="card"><b>${esc(s.skill)}</b><div class="metric">${Math.round(Number(s.accuracy||0)*100)}%</div><div class="muted">${s.attempts} attempts</div></div>`).join('')}</div><div class="feedback section">Recall reviews: ${d.reviews?.reviews??0} · Average retrievability at review: ${Number(d.reviews?.retrievability||0).toFixed(2)}</div>`}
function showFocus(){panel.innerHTML=`<div class="card"><h2>Focus lab</h2><div class="timer" id="timer">25:00</div><div class="row" style="justify-content:center"><button class="btn" onclick="setTimer(25)">25 min</button><button class="btn" onclick="setTimer(50)">50 min</button><button class="btn" onclick="setTimer(5)">5 min</button></div><div class="row section" style="justify-content:center"><button class="btn primary" onclick="toggleTimer()">Start / pause</button><button class="btn" onclick="resetTimer()">Reset</button></div><p class="muted section">End each focus block with retrieval: close your notes and write what you can reconstruct. That retrieval event is the memory training.</p></div>`}
function setTimer(m){timerSec=m*60;renderTimer()}function renderTimer(){timer.textContent=`${String(Math.floor(timerSec/60)).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`}function toggleTimer(){if(timer)clearInterval(timer);else timer=setInterval(()=>{timerSec--;renderTimer();if(timerSec<=0){clearInterval(timer);timer=null;alert('Focus block complete. Do a closed-book retrieval now.')}},1000)}function resetTimer(){if(timer)clearInterval(timer);timer=null;timerSec=1500;renderTimer()}
boot().catch(e=>{$('#app').innerHTML=`<div class="card"><h2>Startup error</h2><p class="muted">${esc(e.message)}</p></div>`});
</script></body></html>
